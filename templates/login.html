{% extends "base.html" %}

{% block title %}Login - Smart Garment{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-8 col-sm-10">
            <div class="card border-0 shadow-sm p-4 rounded-0 my-4" style="border-top: 3px solid var(--primary-color) !important;">
                <div class="text-center mb-4">
                    <h2 class="mb-1">Customer Login</h2>
                    <p class="text-muted small">Welcome back! Sign in to access your profile and saved measurements.</p>
                </div>
                
                <form action="{{ url_for('login') }}" method="POST">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-end-0 rounded-0"><i class="fa-regular fa-envelope text-muted"></i></span>
                            <input type="email" class="form-control border-start-0 rounded-0" id="email" name="email" required placeholder="name@example.com">
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <div class="d-flex justify-content-between mb-1">
                            <label for="password" class="form-label mb-0">Password</label>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-end-0 rounded-0"><i class="fa-solid fa-lock text-muted"></i></span>
                            <input type="password" class="form-control border-start-0 rounded-0" id="password" name="password" required placeholder="••••••••">
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-luxury w-100 py-2.5 rounded-0 mb-3">Sign In</button>
                </form>
                
                <div class="text-center mt-3">
                    <p class="mb-1 text-muted">Don't have an account? <a href="{{ url_for('register') }}" class="text-dark fw-bold">Sign Up</a></p>
                    <p class="mb-0 text-muted"><i class="fa-solid fa-user-shield me-1"></i> Staff? <a href="{{ url_for('admin_login') }}" class="text-accent">Admin Portal</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
